<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Ludo — Play with friends</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="bootstrap.min.css">
  <link rel="stylesheet" href="index.css">
</head>
<body>

<!-- Onboarding modal (Phase 6) -->
<div id="onboardingModal" class="onboard-modal" style="display:none;">
  <div class="onboard-content">
    <h1>Welcome to Ludo</h1>
    <p>Enter your player name to continue</p>
    <input id="onboardName" type="text" class="form-control" maxlength="50" placeholder="Your name">
    <div id="onboardError" class="text-danger small mt-2" style="display:none;"></div>
    <div class="mt-3 d-flex justify-content-center">
      <button id="onboardSave" class="btn btn-primary me-2">Save &amp; Continue</button>
    </div>
  </div>
</div>

<!-- LOBBY SECTION: Create/Join -->
<main id="lobbySection" class="lobby-container">
  <section class="lobby-card">
    <header class="lobby-header text-center">
      <h1 class="lobby-title">LUDO</h1>
      <p class="lobby-subtitle">Play with friends &amp; family</p>
    </header>

    <div class="lobby-body">
      <label class="form-label small">Player name</label>
      <input id="playerName" class="form-control mb-2" placeholder="Your name" />

      <div id="playerInfo" class="small text-muted mb-3" style="display:none;">
        Playing as: <span id="playerInfoName"></span>
        <button id="changeNameBtn" class="btn btn-link btn-sm text-decoration-none">Change</button>
      </div>

      <label class="form-label small">Players per room</label>
      <div class="player-count-selector mb-3">
        <button class="player-count-btn" data-count="2">2 Players</button>
        <button class="player-count-btn" data-count="3">3 Players</button>
        <button class="player-count-btn active" data-count="4">4 Players</button>
      </div>
      <span id="selectedCountDisplay" class="small text-muted">Selected: 4 players</span>

      <label class="form-label small mt-3">Room code (optional)</label>
      <input id="roomCode" class="form-control mb-3" placeholder="Enter room code or leave blank to create" />

      <div class="d-grid gap-2">
        <button id="createRoom" class="btn btn-success">Create Room</button>
        <button id="joinRoom" class="btn btn-primary">Join Room</button>
      </div>

      <div class="mt-3 text-center small text-muted">
        Note: Colors are assigned automatically. Red = Host.
      </div>
    </div>

    <footer class="lobby-footer text-center small text-muted">
      <div id="status" aria-live="polite"></div>
    </footer>
  </section>
</main>

<!-- WAITING ROOM SECTION -->
<main id="waitingRoomSection" class="waiting-room-container" style="display:none;">
  <section class="waiting-room-card">
    <header class="waiting-room-header text-center">
      <h1 class="waiting-room-title">LUDO</h1>
      <p class="waiting-room-subtitle">Waiting for players...</p>
    </header>

    <div class="waiting-room-body">
      <div class="room-code-box">
        <div class="room-code-label">ROOM CODE</div>
        <div class="room-code-value" id="displayRoomCode">------</div>
        <button id="copyCodeBtn" class="btn btn-sm btn-outline-secondary mt-2">Copy Code</button>
      </div>

      <div class="players-section mt-4">
        <h5>Players</h5>
        <div id="playersList" class="players-list">
          <!-- Dynamically filled -->
        </div>
        <div id="playerCountDisplay" class="mt-2 text-center small text-muted">
          0 / 4 players
        </div>
      </div>

      <div class="mt-4 d-grid gap-2">
        <button id="startGameBtn" class="btn btn-success" disabled>Start Game</button>
        <button id="leaveRoomBtn" class="btn btn-outline-danger">Leave Room</button>
      </div>
    </div>

    <footer class="waiting-room-footer text-center small text-muted">
      <div id="waitingRoomStatus" aria-live="polite"></div>
    </footer>
  </section>
</main>

<!-- WebSocket fallback (unchanged) -->
<script>
  const ws = new WebSocket("wss://ludobygaurave-pen5.onrender.com");
  ws.onopen = () => { 
    const s = document.getElementById('status'); 
    if (s) s.innerText = 'Connected to server ✅'; 
    console.log('[WS] connected'); 
  };
  ws.onmessage = (e) => { 
    try { 
      const data = JSON.parse(e.data); 
      console.log('[WS] message', data); 
    } catch (e) { 
      console.log('[WS] message', e); 
    } 
  };
  ws.onerror = () => { 
    const s = document.getElementById('status'); 
    if (s) s.innerText = 'Server connection failed ❌'; 
    console.warn('[WS] error'); 
  };
</script>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<!-- Firebase config & init -->
<script src="js/firebase-config.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/firebase-room.js"></script>

<!-- Onboarding (must run before lobby handlers) -->
<script src="js/onboarding.js"></script>

<!-- Lobby logic -->
<script src="index.js"></script>

</body>
</html>
